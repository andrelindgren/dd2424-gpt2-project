[project]
name = "dd2424-gpt2"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch==2.11.0+cu126",
    "transformers>=4.46,<5",
    "einops>=0.8",
    "sacrebleu>=2.5",
    "scikit-learn>=1.5",
    "tqdm>=4.66",
    "requests>=2.32",
    "filelock>=3.13",
    "importlib-metadata>=7",
    "numpy>=2.0",
    "matplotlib>=3.9",
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu126" }]

[tool.uv]
package = false